<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hỏi nhỏ nè 💕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 22px;
        width: 330px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        position: relative;
        z-index: 10;
    }

    h2 {
        color: #ff4d6d;
        margin-bottom: 10px;
    }

    .icons {
        font-size: 32px;
        margin-bottom: 10px;
    }

    button {
        padding: 12px 22px;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        cursor: pointer;
        margin: 8px;
        transition: 0.3s;
    }

    #yes {
        background: #ff4d6d;
        color: white;
    }

    #no {
        background: #ddd;
    }

    #message {
        min-height: 40px;
        margin-top: 10px;
        color: #555;
        font-size: 15px;
    }

    .float {
        position: fixed;
        bottom: -30px;
        animation: floatUp 6s linear forwards;
        opacity: 0.9;
    }

    @keyframes floatUp {
        from {
            transform: translateY(0);
            opacity: 1;
        }
        to {
            transform: translateY(-110vh);
            opacity: 0;
        }
    }
</style>
</head>
<body>

<div class="card" id="card">
    <div class="icons">🐻🐱💖</div>
    <h2>Cậu có thích tớ không? 🥺</h2>

    <button id="yes" onclick="agree()">Đồng ý ❤️</button>
    <button id="no" onclick="refuse()">Không 😢</button>

    <div id="message"></div>

    <button onclick="playMusic()" style="font-size:13px;margin-top:10px;">
        ▶ Bật nhạc nè 🎵
    </button>
</div>

<audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
let count = 0;
const pleas = [
    "🐱 Thôi màaa, suy nghĩ lại đi 🥹",
    "🐻 Tớ thích cậu thật lòng đó 😭",
    "🐱 Cho tớ một cơ hội được không? 💔",
    "🐻 Không chọn là tớ buồn lắm luôn 😖"
];

function refuse() {
    const noBtn = document.getElementById("no");
    const msg = document.getElementById("message");

    if (count < pleas.length) {
        msg.innerText = pleas[count];
        spawn("🥺");
        count++;

        // Nút KHÔNG chạy
        noBtn.style.position = "absolute";
        noBtn.style.left = Math.random() * 220 + "px";
        noBtn.style.top = Math.random() * 200 + "px";
    }

    if (count === pleas.length) {
        noBtn.style.display = "none";
        msg.innerText = "🐻🐱 Giờ chỉ còn Đồng ý thôi nè 😌💖";
    }
}

function agree() {
    document.getElementById("card").innerHTML = `
        <div style="font-size:40px;">🐻🐱💖</div>
        <h2>YAYYYY 🎉</h2>
        <p>Tớ biết màaa 😍<br>
        Từ giờ mình là một cặp nha 💕</p>
    `;
    for (let i = 0; i < 20; i++) {
        spawn("💖");
        spawn("🐻");
        spawn("🐱");
    }
}

function playMusic() {
    document.getElementById("music").play();
}

function spawn(icon) {
    const el = document.createElement("div");
    el.className = "float";
    el.innerText = icon;
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 6000);
}

// icon bay nhẹ mặc định
setInterval(() => {
    spawn("💗");
}, 700);
</script>

</body>
</html>
